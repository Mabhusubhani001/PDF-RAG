version: '3.8'

services:
  # Qdrant Vector Database Container
  qdrant:
    image: qdrant/qdrant:latest
    container_name: pdf_rag_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI RAG Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pdf_rag_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - LOCAL_QDRANT_URL=http://qdrant:6333
      - LOCAL_COLLECTION_NAME=my_documents
      - CLOUD_COLLECTION_NAME=my_documents_cloud
    depends_on:
      qdrant:
        condition: service_healthy
